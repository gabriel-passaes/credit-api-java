name: Deploy To VPS

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Acessar VPS e Atualizar Container
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/credit-api:latest
            docker stop credit-api || true
            docker rm credit-api || true
            docker run -d --name credit-api -p 80:8080 ${{ secrets.DOCKER_HUB_USERNAME }}/credit-api:latest
